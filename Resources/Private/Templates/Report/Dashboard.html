<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Report" />

<f:section name="content">

	<div class="ns-feedback-premium-strip d-flex flex-wrap align-items-center justify-content-between gap-2">
		<div class="d-flex flex-wrap align-items-center gap-2">
			<core:icon identifier="actions-rocket" size="small" />
			<strong><f:translate key="premium.strip.headline" /></strong>
			<span><f:translate key="premium.strip.description" /></span>
		</div>
		<a href="{trialUrl}" class="btn btn-primary"><f:translate key="premium.strip.trial" /></a>
	</div>

	<div class="ns-ext-dashboard-wrap">
		<div class="row">
			<div class="col-lg-8 col-xl-9">
				<f:if condition="{total}">
					<f:then>
						<div class="row">
							<div class="col-sm-6 col-lg-4">
								<div class="card">
									<div class="card-body">
										<div class="ns-ext-report-block d-flex align-items-center">
											<div class="report-block-content">
												<h5><f:translate key="tx_nsfeedback_domain_model_feedbacks.total" /></h5>
											</div>
											<div class="report-block-icon">
												<em class="fa" aria-hidden="true"><strong><span>{total}</span></strong></em>
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="col-sm-6 col-lg-4">
								<div class="card">
									<div class="card-body">
										<div class="ns-ext-report-block d-flex align-items-center">
											<div class="report-block-content">
												<h5><f:translate key="yes" /></h5>
												<h5><f:translate key="no" /></h5>
											</div>
											<div class="report-block-icon">
												<h5>{totalyescount}</h5>
												<h5>{totalnocount}</h5>
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="col-sm-6 col-lg-4">
								<div class="card">
									<div class="card-body">
										<div class="ns-ext-report-block d-flex align-items-center">
											<div class="report-block-content">
												<h5><f:translate key="yesbut" /></h5>
												<h5><f:translate key="nobut" /></h5>
											</div>
											<div class="report-block-icon">
												<h5>{totalyesbutcount}</h5>
												<h5>{totalnobutcount}</h5>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</f:then>
					<f:else>
						<div class="alert alert-info" role="alert">
							<h4 class="alert-heading"><f:translate key="opps" extensionName="ns_feedback"/></h4>
							<p><f:translate key="info1" extensionName="ns_feedback" /></p>
							<p><f:translate key="info2" extensionName="ns_feedback" /></p>
						</div>
					</f:else>
				</f:if>
				<f:format.raw>{dashboardSupport}</f:format.raw>
			</div>
			<f:format.raw>{rightSide}</f:format.raw>
		</div>
	</div>
</f:section>

</html>
